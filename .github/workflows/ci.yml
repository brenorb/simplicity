name: CI

on: [push, pull_request]

jobs:
  jet-target-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the frozen verification-target manifest
        # Keep this pin independent of the manifest and checker being tested.
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "8ba2f4d48470b988eab2de57ec2cbc79604b3c368d517f368a036093f5d43896"
          actual = hashlib.sha256(Path("Coq/C/jet_source_target.tsv").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("Frozen target manifest changed; separate target-change approval required")
          PY
      - name: Reject production, specification, AST and generation-setting drift
        run: python3 Coq/check-jet-source-target.py
      - name: Exercise target freeze against mutations
        run: python3 Coq/test-jet-source-target.py

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: codespell-project/actions-codespell@v2
        with:
            ignore_words_file: spelling.ignore.txt
            skip: alectryon
  clang-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test C library with clang (-Wall -Werror)
        run: CC=clang CFLAGS="-Wimplicit-fallthrough -Wconditional-uninitialized" make -C C -j$(nproc) check doCheck=1
  build:
    strategy:
      fail-fast: false
      matrix:
        project: ["c", "cmake", "haskell"] # the full coq derivation takes over six hours; the jet proofs have dedicated jobs below
        os: ["ubuntu-latest", macos-latest]
        channel: ["nixos-25.05", "nixpkgs-unstable"]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Update channel ${{matrix.channel}}
        run: |
          nix-channel --add https://nixos.org/channels/${{matrix.channel}} nixpkgs
          nix-channel --update
      - run: nix-build -A ${{matrix.project}}

  # The jet proofs (Coq/C/jet_*.v) are verified by four separate jobs instead of
  # the full `coq` derivation. The pinned CompCert/VST source build is cached;
  # Coq is installed in each proof job by opam.
  jets-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JET_DEPS: ${{ github.workspace }}/.jet-deps
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.1
      - run: opam install -y coq.8.17.1 menhir
      - name: Restore pinned CompCert and VST
        uses: actions/cache@v4
        with:
          path: ${{ env.JET_DEPS }}
          key: jet-deps-${{ hashFiles('Coq/jet-deps.sh', 'Coq/jet-elliptic-deps.sh') }}
      - run: opam exec -- bash Coq/jet-deps.sh
      - run: opam exec -- bash Coq/jet-elliptic-deps.sh
  jets:
    needs: jets-deps
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JET_DEPS: ${{ github.workspace }}/.jet-deps
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.1
      - run: opam install -y coq.8.17.1 menhir
      - name: Restore pinned CompCert and VST
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.JET_DEPS }}
          key: jet-deps-${{ hashFiles('Coq/jet-deps.sh', 'Coq/jet-elliptic-deps.sh') }}
          fail-on-cache-miss: true
      - run: sudo apt-get install -y clang
      - run: bash Coq/jet-sysroot.sh
      - name: Accept final proofs against reviewed snapshots and all five pinned ASTs
        run: opam exec -- bash Coq/check-jets.sh --accept
  jets-ast:
    needs: jets-deps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JET_DEPS: ${{ github.workspace }}/.jet-deps
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned CompCert and VST
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.JET_DEPS }}
          key: jet-deps-${{ hashFiles('Coq/jet-deps.sh', 'Coq/jet-elliptic-deps.sh') }}
          fail-on-cache-miss: true
      - run: sudo apt-get install -y clang
      - name: Regenerate the committed AST with the pinned glibc headers
        run: |
          bash Coq/jet-sysroot.sh
          COMPCERT="$JET_DEPS/compcert-3.14" JET_SYSROOT="$JET_DEPS/sysroot-glibc-2.36" \
            bash Coq/C/check-jets-generation.sh
          COMPCERT="$JET_DEPS/compcert-3.14" JET_SYSROOT="$JET_DEPS/sysroot-glibc-2.36" \
            bash Coq/C/check-bitcoin-jets-generation.sh
          COMPCERT="$JET_DEPS/compcert-3.14" JET_SYSROOT="$JET_DEPS/sysroot-glibc-2.36" \
            bash Coq/C/check-sha-jets-generation.sh
          COMPCERT="$JET_DEPS/compcert-3.14" JET_SYSROOT="$JET_DEPS/sysroot-glibc-2.36" \
            bash Coq/C/check-secp-jets-generation.sh
          COMPCERT="$JET_DEPS/compcert-3.14" JET_SYSROOT="$JET_DEPS/sysroot-glibc-2.36" \
            bash Coq/C/check-elements-jets-generation.sh

  jets-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Select the supported Coq package set
        run: |
          nix-channel --add https://nixos.org/channels/nixos-25.05 nixpkgs
          nix-channel --update
      - name: Build jets with the same kernel, assumption and contract gates
        run: nix-build -A coqJets
